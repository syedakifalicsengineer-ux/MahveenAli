<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Special Surprise</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

body{
font-family:'Poppins',sans-serif;
background:linear-gradient(270deg,#ff9a9e,#fecfef,#fad0c4);
background-size:600% 600%;
animation:bgMove 12s ease infinite;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
transition:1s;
padding:10px;
}

body.open-bg{
background:url("bg.jpg") no-repeat center center;
background-size:cover;
animation:none;
}

@keyframes bgMove{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

.heart{
position:absolute;
color:#ff4d6d;
font-size:20px;
animation:float 8s linear infinite;
opacity:.7;
}

@keyframes float{
0%{transform:translateY(100vh) scale(.5)}
100%{transform:translateY(-10vh) scale(1.3)}
}

.envelope-container{
position:relative;
cursor:pointer;
animation:breath 3s infinite ease-in-out;
}

@keyframes breath{
0%,100%{transform:scale(1)}
50%{transform:scale(1.05)}
}

.envelope{
width:300px;
height:200px;
background:#ff4d6d;
border-radius:10px;
position:relative;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

.flap{
position:absolute;
top:0;
left:0;
width:0;
height:0;
border-left:150px solid transparent;
border-right:150px solid transparent;
border-top:110px solid #ff758f;
transform-origin:top;
transition:transform .8s;
z-index:5;
}

.pocket{
position:absolute;
bottom:0;
left:0;
width:0;
height:0;
border-left:150px solid transparent;
border-right:150px solid transparent;
border-bottom:200px solid #ff4d6d;
}

.letter-preview{
width:260px;
height:180px;
background:white;
position:absolute;
bottom:0;
border-radius:5px;
transition:transform 1s;
}

.seal{
width:40px;
height:40px;
background:#d00000;
border-radius:50%;
position:absolute;
top:80px;
left:130px;
display:flex;
justify-content:center;
align-items:center;
color:#fff;
animation:beat 1.2s infinite;
}

@keyframes beat{
0%,100%{transform:scale(1)}
50%{transform:scale(1.2)}
}

.envelope-container.open .flap{
transform:rotateX(180deg);
}

.envelope-container.open .letter-preview{
transform:translateY(-120px);
}

.open-btn{
margin-top:30px;
padding:15px 40px;
border:none;
background:white;
color:#ff4d6d;
font-size:20px;
border-radius:50px;
cursor:pointer;
box-shadow:0 5px 20px rgba(255,77,109,.4);
transition:.3s;
}

.open-btn:hover{
transform:scale(1.1);
}

#letter-view{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.25);
display:none;
justify-content:center;
align-items:center;
padding:15px;
}

#letter-view.active{
display:flex;
animation:fade .6s;
}

@keyframes fade{
from{opacity:0}
to{opacity:1}
}

.love-letter{
background:rgba(255,255,255,0.85);
padding:40px;
max-width:500px;
border-radius:10px;
animation:popup .7s;
backdrop-filter:blur(6px);
position:relative;
}

@keyframes popup{
0%{transform:scale(.5);opacity:0}
100%{transform:scale(1);opacity:1}
}

.love-letter h2{
font-family:'Dancing Script',cursive;
font-size:40px;
color:#ff4d6d;
margin-bottom:20px;
}

.love-letter p{
font-family:'Dancing Script',cursive;
font-size:22px;
margin-bottom:10px;
overflow:hidden;
white-space:nowrap;
width:0;
display:inline-block;
animation:typing 4s steps(40,end) forwards;
}
.love-letter p:nth-of-type(1){animation-delay:1s;}
.love-letter p:nth-of-type(2){animation-delay:4s;}
.love-letter p:nth-of-type(3){animation-delay:7s;}
.love-letter p:nth-of-type(4){animation-delay:10s;}
.love-letter p:nth-of-type(5){animation-delay:13s;}

@keyframes typing{
from{width:0}
to{width:100%}
}

.close-btn{
position:absolute;
top:10px;
right:20px;
font-size:25px;
cursor:pointer;
border:none;
background:none;
}

/* MOBILE RESPONSIVE FOR PIXEL */

@media (max-width:420px){

.envelope{
width:220px;
height:150px;
}

.flap{
border-left:110px solid transparent;
border-right:110px solid transparent;
border-top:80px solid #ff758f;
}

.pocket{
border-left:110px solid transparent;
border-right:110px solid transparent;
border-bottom:150px solid #ff4d6d;
}

.letter-preview{
width:190px;
height:130px;
}

.seal{
width:30px;
height:30px;
top:60px;
left:95px;
font-size:14px;
}

.open-btn{
font-size:16px;
padding:12px 25px;
}

.love-letter{
max-width:95%;
padding:25px;
}

.love-letter h2{
font-size:30px;
}

.love-letter p{
font-size:18px;
white-space:nowrap;
}

}

</style>
</head>

<body>

<div class="heart" style="left:10%">❤️</div>
<div class="heart" style="left:30%;animation-delay:2s">💖</div>
<div class="heart" style="left:50%;animation-delay:4s">💕</div>
<div class="heart" style="left:70%;animation-delay:1s">💗</div>
<div class="heart" style="left:90%;animation-delay:3s">💓</div>

<div>

<div class="envelope-container" id="envelope">
<div class="envelope">
<div class="pocket"></div>
<div class="letter-preview"></div>
<div class="flap"></div>
<div class="seal">❤️</div>
</div>
</div>

<center>
<button class="open-btn" onclick="openEnvelope(); changeBG();">Open Me</button>
</center>

</div>

<div id="letter-view">
<div class="love-letter">

<button class="close-btn" onclick="closeLetter()">×</button>

<h2>My Dearest Wife مہوین</h2>

<p>Every moment with you is special.</p>
<p>I’m really sorry I hurt you. You mean a lot to me.</p>
<p>Your smile matters to me more than anything.</p>
<p>I may not be perfect, but I truly care about you.</p>

<p style="text-align:right">— Yours Forever: <span style="color:#ff4d6d;">علي</span></p>

</div>
</div>

<video id="bgMusic" src="music.mp4" style="display:none"></video>

<script>

function openEnvelope(){

document.getElementById("envelope").classList.add("open")

let music = document.getElementById("bgMusic")
music.volume = 0.6
music.play()

setTimeout(()=>{
document.getElementById("letter-view").classList.add("active")
},1200)

}

function closeLetter(){

document.getElementById("letter-view").classList.remove("active")

document.getElementById("bgMusic").pause()

}

function changeBG(){
document.body.classList.add("open-bg")
}

</script>

</body>
</html>
